<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyBuy Store - Admin Dashboard</title>
  <style>
    :root {
      --bg-card: #ffffff;
      --radius-sm: 8px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --transition-normal: all 0.3s ease;
      --primary-color: #2563eb;
      --success-color: #16a34a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #1f2937;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-success {
      background-color: var(--success-color);
      color: white;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    /* Modal Styling preventing accidental backdrop clicks */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 1;
      transition: opacity var(--transition-normal);
      pointer-events: none; /* Disables backdrop dismiss */
    }

    .modal-container {
      pointer-events: auto; /* Re-enables interaction inside modal */
      background-color: var(--bg-card);
      border-radius: var(--radius-sm);
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: var(--shadow-lg);
      padding: 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 120px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>EasyBuy Admin Dashboard</h1>
    <p>Import catalog listings from WhatsApp directly into your catalog database.</p>

    <!-- WhatsApp Import Modal Overlay -->
    <div class="modal-overlay">
      <div class="modal-container">
        <div class="modal-header">
          <h2 class="modal-title">Import WhatsApp Catalog</h2>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label for="whatsappCatalogText">Paste Catalog Text:</label>
            <textarea id="whatsappCatalogText" class="form-control" placeholder="Product: Nike Air Shoes&#10;Price: 1200&#10;Description: Comfortable sneakers"></textarea>
          </div>

          <div style="margin-bottom: 20px;">
            <button id="importCatalogBtn" class="btn btn-primary">Import & Scrape MRP</button>
          </div>

          <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0;">

          <h3>Preview & Verification</h3>
          <div id="importPreviewContainer">
            <p style="color: #6b7280;">No products imported yet. Paste catalog text above and click "Import & Scrape MRP".</p>
          </div>

          <div style="margin-top: 20px;">
            <button id="saveProductsBtn" class="btn btn-success" style="display: none; width: 100%;">Save Products to Store</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
